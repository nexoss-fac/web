<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Background -->
  <rect width="500" height="500" fill="#FFFFFF"/>
  
  <!-- Outer Square Border -->
  <rect x="40" y="40" width="420" height="420" fill="none" stroke="#000000" stroke-width="24"/>
  
  <!-- MAKD Typography Group -->
  <g fill="#000000">
    <!-- Letter M -->
    <path d="M 65 205 L 105 205 L 125 242 L 145 205 L 185 205 L 185 265 L 155 265 L 155 233 L 135 265 L 115 265 L 95 233 L 95 265 L 65 265 Z"/>
    
    <!-- Letter A with distinctive diagonal cut -->
    <!-- Top and Right part of A -->
    <path d="M 215 205 L 245 205 L 275 265 L 245 265 L 238 250 L 210 250 L 206 257 L 199 253 L 215 224 Z"/>
    <!-- Bottom Left leg of A (separated by diagonal slice) -->
    <path d="M 191 247 L 198 234 L 205 247 L 185 265 L 175 265 Z"/>
    <!-- Inner cutout of A -->
    <polygon points="225,224 233,240 217,240" fill="#FFFFFF"/>
    
    <!-- Letter K -->
    <path d="M 285 205 L 315 205 L 315 227 L 340 205 L 375 205 L 338 235 L 378 265 L 342 265 L 315 242 L 315 265 L 285 265 Z"/>
    
    <!-- Letter D -->
    <path d="M 385 205 L 420 205 C 438 205 448 215 448 235 C 448 255 438 265 420 265 L 385 265 Z M 412 225 L 412 245 C 418 245 422 242 422 235 C 422 228 418 225 412 225 Z" fill-rule="evenodd"/>
  </g>
  
  <!-- Word SHOP (Right aligned under AKD) -->
  <text x="448" y="306" text-anchor="end" font-family="'Space Grotesk', 'Arial Black', -apple-system, sans-serif" font-size="34" font-weight="900" letter-spacing="3" fill="#000000">SHOP</text>
  
  <!-- Slogan "marcamos tu estilo" (Right aligned under SHOP) -->
  <text x="448" y="328" text-anchor="end" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="16" font-style="italic" font-weight="500" letter-spacing="0.5" fill="#000000">marcamos tu estilo</text>
</svg>
